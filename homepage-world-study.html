<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>奥行きと動きを見比べる｜おけもんHP</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8e9e3;color:#2b3b32;font-family:system-ui,sans-serif}header{padding:20px 28px;background:#faf9f5;border-bottom:1px solid #cdd1c6}h1{font-size:17px;font-weight:600;margin:0 0 9px}p{font-size:12px;line-height:1.8;margin:0;color:#6c786e}.row{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}.buttons{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}button,a{font:12px/1.4 system-ui;color:inherit}button{padding:11px 18px;border:1px solid #cdd1c6;border-radius:5px;background:transparent;cursor:pointer}button[aria-pressed=true]{background:#355144;border-color:#355144;color:white}a{text-underline-offset:4px}main{padding:16px}iframe{width:100%;height:calc(100dvh - 196px);min-height:520px;border:0;outline:1px solid #d2d7cb;background:#fbf9f5;display:block;margin:auto}.mobile iframe{max-width:390px}button:focus-visible,a:focus-visible{outline:3px solid #b9914f;outline-offset:4px}@media(max-width:650px){header{padding:17px}main{padding:7px}iframe{height:78dvh}.row{gap:8px}}
</style></head><body><header><div class="row"><div><h1>奥行きと動きを見比べる</h1><p id="description" aria-live="polite">修正案：素材を個別に配置し、前後の重なりと異なる動きで、一つの空間をつくる。</p></div><a href="https://x.com/MatoToushi/status/2099660833609638059" target="_blank" rel="noopener">元の参考動画を見る ↗</a></div><div class="buttons"><button id="before" aria-pressed="false">前の版 · v9</button><button id="after" aria-pressed="true">奥行きと動きの修正案</button><button id="width" aria-pressed="false">スマホ幅にする</button><a id="direct" href="homepage-world.html" target="_blank" rel="noopener" style="padding:11px">ページだけ開く ↗</a></div></header><main id="canvas"><iframe id="preview" src="homepage-world.html" title="奥行きと動きの修正案"></iframe></main><script>
const before=document.querySelector('#before'),after=document.querySelector('#after'),frame=document.querySelector('#preview');function centerScene(){const scene=frame.contentDocument.querySelector('.studio-visual');if(scene){const doc=frame.contentDocument;doc.documentElement.style.scrollBehavior='auto';const top=scene.getBoundingClientRect().top+frame.contentWindow.scrollY-Math.max(20,(frame.clientHeight-scene.clientHeight)/2);frame.contentWindow.scrollTo(0,Math.max(0,top));}}frame.addEventListener('load',centerScene);function select(isAfter){before.setAttribute('aria-pressed',String(!isAfter));after.setAttribute('aria-pressed',String(isAfter));frame.src=isAfter?'homepage-world.html':'homepage-craft.html';frame.title=isAfter?'奥行きと動きの修正案':'前の版 v9';document.querySelector('#direct').href=frame.src;document.querySelector('#description').textContent=isAfter?'修正案：素材を個別に配置し、前後の重なりと異なる動きで、一つの空間をつくる。':'前の版：質感を揃えた左右2つの小物群が、それぞれまとまって動く。';}before.addEventListener('click',()=>select(false));after.addEventListener('click',()=>select(true));document.querySelector('#width').addEventListener('click',function(){const mobile=this.getAttribute('aria-pressed')!=='true';this.setAttribute('aria-pressed',String(mobile));document.querySelector('#canvas').classList.toggle('mobile',mobile);this.textContent=mobile?'画面幅に戻す':'スマホ幅にする';requestAnimationFrame(centerScene);});
</script></body></html>
