</style></head><body><header><div class="row"><div><h1>内容とデザインを見比べる</h1><p id="description" aria-live="polite">画像の重複を解消。実務研修と下書きの確認を、別々の場面で紹介します。</p></div><a href="https://x.com/MatoToushi/status/2099660833609638059" target="_blank" rel="noopener">元の参考動画を見る ↗</a></div><div class="buttons"><button id="before" aria-pressed="false">前の版 · v11</button><button id="after" aria-pressed="true">場面別の画像に修正 · v13</button><button id="width" aria-pressed="false">スマホ幅にする</button><a href="okemon-care-ai.html?v=13" target="_blank" rel="noopener" style="padding:11px">AI現場伴走室を見る ↗</a><a id="direct" href="homepage-world.html?v=13" target="_blank" rel="noopener" style="padding:11px">ページだけ開く ↗</a></div></header><main id="canvas"><iframe id="preview" src="homepage-world.html?v=13" title="場面別の画像に修正 · v13"></iframe></main><script>
const before=document.querySelector('#before'),after=document.querySelector('#after'),frame=document.querySelector('#preview');function centerScene(){frame.contentWindow.scrollTo(0,0);}frame.addEventListener('load',centerScene);function select(isAfter){before.setAttribute('aria-pressed',String(!isAfter));after.setAttribute('aria-pressed',String(isAfter));frame.src=isAfter?'homepage-world.html?v=13':'homepage-world-v11.html';frame.title=isAfter?'場面別の画像に修正 · v13':'前の版 v11';document.querySelector('#direct').href=frame.src;document.querySelector('#description').textContent=isAfter?'画像の重複を解消。実務研修と下書きの確認を、別々の場面で紹介します。':'前の版：浮遊トップと日本語校正までを反映したv11。';}before.addEventListener('click',()=>select(false));after.addEventListener('click',()=>select(true));document.querySelector('#width').addEventListener('click',function(){const mobile=this.getAttribute('aria-pressed')!=='true';this.setAttribute('aria-pressed',String(mobile));document.querySelector('#canvas').classList.toggle('mobile',mobile);this.textContent=mobile?'画面幅に戻す':'スマホ幅にする';requestAnimationFrame(centerScene);});
