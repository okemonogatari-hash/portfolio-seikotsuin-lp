<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>おけもんHP｜バージョン比較</title><style>*{box-sizing:border-box}body{margin:0;background:#e8ece7;color:#263d34;font:14px system-ui,sans-serif}header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 22px;background:#fff;border-bottom:1px solid #ccd4cc}h1{font-size:15px;margin:0 14px 0 0}button,a{font:inherit;padding:8px 13px;border:1px solid #c0cdc2;background:#fff;color:inherit;border-radius:5px;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#286b56;color:white;border-color:#286b56}.status{font-size:12px;margin-left:auto}main{padding:20px 8px}iframe{display:block;margin:auto;background:#faf9f3;border:1px solid #ccd4cc;width:100%;max-width:1440px;height:calc(100vh - 125px);min-height:560px}button:focus-visible,a:focus-visible{outline:3px solid #b36c39;outline-offset:3px}@media(max-width:500px){header{padding:12px;gap:7px}.status{width:100%}iframe{height:75vh;min-height:500px}}</style>
<header><h1>おけもんHPの見くらべ</h1><button data-version="index.html" aria-pressed="true">改善版 v2</button><button data-version="homepage-before-20260922.html" aria-pressed="false">変更前 v1</button><button id="mobile" aria-pressed="false">スマホ幅 390px</button><a id="direct" href="index.html" target="_blank">ページを開く ↗</a><a href="homepage-lab.html">写真の3案を見る ↗</a><span class="status">試作・本番反映前</span></header><main><iframe id="site" title="改善版 v2 のプレビュー" src="index.html"></iframe></main>
<script>const frame=document.getElementById('site');document.querySelectorAll('[data-version]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-version]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));frame.src=b.dataset.version;frame.title=b.textContent+' のプレビュー';document.getElementById('direct').href=b.dataset.version;}));document.getElementById('mobile').addEventListener('click',function(){const on=this.getAttribute('aria-pressed')!=='true';this.setAttribute('aria-pressed',String(on));frame.style.maxWidth=on?'390px':'1440px';});</script></html>
